server {
    listen 86;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The OAuth `code` from Home Assistant lands in the query string of the
    # first request, so this server never keeps request logs.
    access_log off;
    log_not_found off;

    # Static app: the browser talks to Home Assistant directly, nothing is
    # proxied here. CSP keeps scripts first-party and lets the HA panel
    # embed the live preview.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.scdn.co; frame-src 'self' https://sdk.scdn.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: wss: http: ws:; media-src 'self' blob: https: http:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https: http:" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Hashed assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/[^/]+\.(svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri /index.html;
    }

    # SPA: /<ha-host> and everything else serves index.html, always revalidated
    # so a redeploy reaches phones (and the HA preview) immediately.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.scdn.co; frame-src 'self' https://sdk.scdn.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: wss: http: ws:; media-src 'self' blob: https: http:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https: http:" always;
        try_files $uri $uri/ /index.html;
    }
}
