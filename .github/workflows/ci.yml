name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check versions
        run: npm run check:versions

      - run: npm run build

      - name: dist size
        run: |
          du -sh dist
          ls -lS dist/assets

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: Smoke test (mock build)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build in mock mode
        run: npm run build
        env:
          VITE_MODE: mock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npx vite preview --port 4173 --strictPort > preview.log 2>&1 &

      - name: Run smoke test
        run: node scripts/smoke.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

  python:
    name: Lint (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.17.4

      - name: ruff check
        run: ruff check custom_components

      - name: ruff format
        run: ruff format --check custom_components
