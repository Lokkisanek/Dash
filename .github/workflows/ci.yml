name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check versions
        run: npm run check:versions

      - name: Check generated files
        run: npm run check:generated

      - name: Unit tests
        run: npm test

      - run: npm run build

      - name: dist size
        run: |
          du -sh dist
          ls -lS dist/assets

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: Smoke test (mock build)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build in mock mode
        run: npm run build
        env:
          VITE_MODE: mock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npx vite preview --port 4173 --strictPort > preview.log 2>&1 &

      - name: Run smoke test
        run: node scripts/smoke.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Run StandBy photo test
        run: node scripts/standby-photos.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Run layout edge test
        run: node scripts/layout-edges.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Run header tile test
        run: node scripts/header-tiles.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Run stage 2 tile test
        run: node scripts/stage2-tiles.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Run player test
        run: node scripts/player.mjs
        env:
          BASE_URL: http://localhost:4173

      - name: Preview server log
        if: failure()
        run: cat preview.log

  python:
    name: Lint and test (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: ruff check
        run: ruff check custom_components tests

      - name: ruff format
        run: ruff format --check custom_components tests

      - name: pytest
        run: pytest -q
